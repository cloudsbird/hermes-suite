name: Build and Push Multi-Arch Image

on:
  push:
    tags:
      - 'v*'
  # Started by auto-update.yml (tag pushes made with GITHUB_TOKEN don't fire
  # the push trigger). Must be run with --ref <tag> so GITHUB_REF_NAME is the tag.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Each architecture builds natively on its own GitHub-hosted runner (no QEMU
# emulation): amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm. Every
# platform/variant pushes an untagged image by digest; the merge job then
# stitches the per-arch digests into the multi-arch tags users pull.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.versions.outputs.docker_tag }}
      agent_version: ${{ steps.versions.outputs.agent_version }}
      webui_version: ${{ steps.versions.outputs.webui_version }}
      portcullis_version: ${{ steps.versions.outputs.portcullis_version }}
      image: ${{ steps.versions.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: versions
        run: |
          # Tag format: v2026.4.30-0.50.278
          TAG="${GITHUB_REF_NAME}"
          # Strip leading 'v' for Docker tag
          DOCKER_TAG="${TAG#v}"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"

          # Extract agent and webui versions from the compound tag
          # 2026.4.30-0.50.278 -> agent=2026.4.30, webui=0.50.278
          # An optional -rN revision suffix (e.g. 2026.9.24-0.52.113-r1) re-releases
          # the same agent/webui pair and is ignored for the version split.
          BASE_TAG="${DOCKER_TAG%-r[0-9]*}"
          AGENT_VER="${BASE_TAG%-*}"
          WEBUI_VER="${BASE_TAG##*-}"
          echo "agent_version=v${AGENT_VER}" >> "$GITHUB_OUTPUT"
          echo "webui_version=v${WEBUI_VER}" >> "$GITHUB_OUTPUT"

          # Portcullis is pinned by commit in versions.env (not part of the tag).
          PORTCULLIS_VER="$(grep -E '^PORTCULLIS_VERSION=' versions.env | cut -d= -f2)"
          [ -n "${PORTCULLIS_VER}" ] || { echo "PORTCULLIS_VERSION missing from versions.env"; exit 1; }
          echo "portcullis_version=${PORTCULLIS_VER}" >> "$GITHUB_OUTPUT"

          # Registry paths must be lowercase.
          echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

          echo "Suite tag:     ${DOCKER_TAG}"
          echo "Agent version: v${AGENT_VER}"
          echo "WebUI version: v${WEBUI_VER}"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        # full = default image; slim = no local Playwright/Chromium
        variant: [full, slim]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - variant: full
            install_browser: "true"
          - variant: slim
            install_browser: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            AGENT_VERSION=${{ needs.prepare.outputs.agent_version }}
            HERMES_WEBUI_VERSION=${{ needs.prepare.outputs.webui_version }}
            PORTCULLIS_VERSION=${{ needs.prepare.outputs.portcullis_version }}
            INSTALL_BROWSER=${{ matrix.install_browser }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Layer cache lives in GHCR (buildcache-<variant>-<arch> tags), not the
          # GitHub Actions cache: four ~4 GB variants overflow the Actions
          # cache's 10 GB repo limit, so its big layers kept being evicted.
          # Each job also reads the other variant of the same arch — full and
          # slim share the base packages and the Portcullis Rust build.
          # ignore-error: a cache write problem must never fail a release.
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.variant == 'full' && 'slim' || 'full' }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [full, slim]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DOCKER_TAG: ${{ needs.prepare.outputs.docker_tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          # full -> <tag> + latest; slim -> <tag>-slim only (no `latest` alias)
          if [ "${VARIANT}" = "full" ]; then
            TAGS=(-t "${IMAGE}:${DOCKER_TAG}" -t "${IMAGE}:latest")
          else
            TAGS=(-t "${IMAGE}:${DOCKER_TAG}-slim")
          fi
          SOURCES=()
          for d in *; do SOURCES+=("${IMAGE}@sha256:${d}"); done
          [ "${#SOURCES[@]}" -eq 2 ] || { echo "Expected 2 digests, got ${#SOURCES[@]}"; exit 1; }
          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"

      - name: Inspect
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DOCKER_TAG: ${{ needs.prepare.outputs.docker_tag }}
          SUFFIX: ${{ matrix.variant == 'slim' && '-slim' || '' }}
        run: docker buildx imagetools inspect "${IMAGE}:${DOCKER_TAG}${SUFFIX}"
